<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login / Register</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">

<style>

body{
margin:0;
font-family:'DM Sans', sans-serif;
background:linear-gradient(135deg,#667eea,#764ba2);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.container{
display:flex;
width:900px;
background:white;
border-radius:12px;
overflow:hidden;
box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

.left{
flex:1;
background:url("https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=600&q=80") center/cover no-repeat;
color:white;
padding:40px;
display:flex;
flex-direction:column;
justify-content:center;
}

.left h1{
font-family:'Playfair Display', serif;
font-size:40px;
margin-bottom:10px;
}

.left p{
font-size:15px;
}

.right{
flex:1;
padding:40px;
}

.tabs{
display:flex;
margin-bottom:25px;
}

.tab{
flex:1;
padding:10px;
border:none;
background:#eee;
cursor:pointer;
font-weight:500;
}

.tab.active{
background:#667eea;
color:white;
}

form{
display:none;
}

form.active{
display:block;
}

h2{
margin-bottom:5px;
}

.subtitle{
color:#777;
margin-bottom:20px;
}

.field{
margin-bottom:15px;
}

.field input{
width:100%;
padding:10px;
border:1px solid #ccc;
border-radius:5px;
}

.row{
display:flex;
gap:10px;
}

.btn{
width:100%;
padding:12px;
background:#667eea;
color:white;
border:none;
border-radius:5px;
cursor:pointer;
margin-top:10px;
}

.switch-text{
text-align:center;
margin-top:15px;
font-size:14px;
}

.switch-text a{
color:#667eea;
cursor:pointer;
}

</style>
</head>

<body>

<div class="container">

<div class="left">
<h1>Welcome<br>Back.</h1>
<p>Sign in or create a new account<br>to continue your journey.</p>
</div>

<div class="right">

<div class="tabs">
<button class="tab active" onclick="switchTab('login',this)">Login</button>
<button class="tab" onclick="switchTab('register',this)">Register</button>
</div>

<form id="login" class="active">
<h2>Sign In</h2>
<p class="subtitle">Good to see you again 👋</p>

<div class="field">
<label>Email</label>
<input type="email" placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>
<input type="password" placeholder="••••••••">
</div>

<button class="btn">Sign In</button>

<p class="switch-text">
Don't have an account? 
<a onclick="switchTab('register')">Register</a>
</p>

</form>


<form id="register">

<h2>Create Account</h2>
<p class="subtitle">Join us today 🚀</p>

<div class="row">

<div class="field">
<label>First Name</label>
<input type="text" placeholder="John">
</div>

<div class="field">
<label>Last Name</label>
<input type="text" placeholder="Doe">
</div>

</div>

<div class="field">
<label>Email</label>
<input type="email" placeholder="you@example.com">
</div>

<div class="field">
<label>Password</label>
<input type="password" placeholder="Min 8 chars, 1 uppercase, 1 special">
</div>

<button class="btn">Create Account</button>

<p class="switch-text">
Already have an account? 
<a onclick="switchTab('login')">Login</a>
</p>

</form>

</div>

</div>

<script>

function switchTab(tab,btn){

document.querySelectorAll("form").forEach(f=>{
f.classList.remove("active")
})

document.getElementById(tab).classList.add("active")

document.querySelectorAll(".tab").forEach(t=>{
t.classList.remove("active")
})

if(btn){
btn.classList.add("active")
}else{
document.querySelectorAll(".tab").forEach(t=>{
if(t.textContent.toLowerCase()==tab){
t.classList.add("active")
}
})
}

}

</script>

</body>
</html>
